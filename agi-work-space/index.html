<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=19" />
    <link rel="icon" type="image/png" href="/favicon.png?v=19" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=19" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ONEPAGE（一页）</title>
    <script>
      (function () {
        try {
          var theme = localStorage.getItem('agi-theme')
          var dark = theme === 'dark' || (theme !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          if (dark) document.documentElement.classList.add('dark')
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
