# =============================================================================
# 内容服务 onepage-content-service（上传 + P1 笔记）
# 值全部来自进程环境变量（与上线一致）。本地由 IDEA 把 .env 注入成环境变量。
# =============================================================================

server:
  port: ${CONTENT_PORT}

spring:
  application:
    name: onepage-content-service
  datasource:
    url: jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT}/${MYSQL_CONTENT_DB}?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=utf8
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}
  cloud:
    nacos:
      server-addr: "${NACOS_SERVER_ADDR}"
      username: ${NACOS_USERNAME}
      password: "${NACOS_PASSWORD}"
      discovery:
        server-addr: "${NACOS_SERVER_ADDR}"
        namespace: ${NACOS_NAMESPACE}
        group: ${NACOS_GROUP}
        context-path: nacos
        username: ${NACOS_USERNAME}
        password: "${NACOS_PASSWORD}"
    loadbalancer:
      nacos:
        enabled: true

onepage:
  internal-token: ${INTERNAL_TOKEN}
  media-public-base: ${MEDIA_PUBLIC_BASE}
  frontend-url: ${FRONTEND_URL}
  minio:
    endpoint: ${MINIO_ENDPOINT}
    access-key: ${MINIO_ACCESS_KEY}
    secret-key: ${MINIO_SECRET_KEY}
    bucket: ${MINIO_BUCKET}
    presign-expiry-sec: ${MINIO_PRESIGN_EXPIRY_SEC}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
