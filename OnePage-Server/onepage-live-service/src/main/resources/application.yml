# =============================================================================
# 直播服务 onepage-live-service
# 值全部来自进程环境变量。房间与场次在 MySQL，在线人数在 Redis。
# =============================================================================

server:
  port: ${LIVE_PORT}

spring:
  application:
    name: onepage-live-service
  datasource:
    url: jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT}/${MYSQL_LIVE_DB}?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=utf8
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD:}
  cloud:
    nacos:
      server-addr: "${NACOS_SERVER_ADDR}"
      username: ${NACOS_USERNAME}
      password: "${NACOS_PASSWORD}"
      discovery:
        server-addr: "${NACOS_SERVER_ADDR}"
        namespace: ${NACOS_NAMESPACE}
        group: ${NACOS_GROUP}
        context-path: nacos
        username: ${NACOS_USERNAME}
        password: "${NACOS_PASSWORD}"
    loadbalancer:
      nacos:
        enabled: true

onepage:
  internal-token: ${INTERNAL_TOKEN}
  live-push-base: ${LIVE_PUSH_BASE}
  live-hls-base: ${LIVE_HLS_BASE}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
