# =============================================================================
# 认证服务 onepage-auth-service
# 值全部来自进程环境变量（与上线一致）。本地由 IDEA 把 .env 注入成环境变量。
# =============================================================================

server:
  port: ${AUTH_PORT}
  servlet:
    session:
      cookie:
        name: ${SESSION_COOKIE_NAME}
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE}
        path: /

spring:
  application:
    name: onepage-auth-service
  datasource:
    url: jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT}/${MYSQL_AUTH_DB}?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=utf8
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD:}
  session:
    # 不要在启动类加 @EnableRedisHttpSession，否则超时被钉死成 1800 秒
    # Hash 值序列化由 Bean springSessionDefaultRedisSerializer（JSON）接管，不要用 JDK 二进制
    store-type: redis
    timeout: ${SESSION_TIMEOUT}
  cloud:
    nacos:
      server-addr: "${NACOS_SERVER_ADDR}"
      username: ${NACOS_USERNAME}
      password: "${NACOS_PASSWORD}"
      discovery:
        server-addr: "${NACOS_SERVER_ADDR}"
        namespace: ${NACOS_NAMESPACE}
        group: ${NACOS_GROUP}
        context-path: nacos
        username: ${NACOS_USERNAME}
        password: "${NACOS_PASSWORD}"
    loadbalancer:
      nacos:
        enabled: true
    openfeign:
      circuitbreaker:
        enabled: false

onepage:
  session-cookie-name: ${SESSION_COOKIE_NAME}
  ops-session-cookie-name: ${SESSION_OPS_COOKIE_NAME:ONEPAGE_OPS_SESSION}
  internal-token: ${INTERNAL_TOKEN}
  frontend-url: ${FRONTEND_URL}
  ops-staff-user-ids: ${OPS_STAFF_USER_IDS:}
  sms:
    mock: ${SMS_MOCK}
    mock-code: "${SMS_MOCK_CODE}"
    cooldown-sec: ${SMS_COOLDOWN_SEC}
  oauth:
    github:
      client-id: "${GITHUB_CLIENT_ID:}"
      client-secret: "${GITHUB_CLIENT_SECRET:}"
      redirect-uri: ${GITHUB_REDIRECT_URI}
    google:
      client-id: "${GOOGLE_CLIENT_ID:}"
      client-secret: "${GOOGLE_CLIENT_SECRET:}"
      redirect-uri: ${GOOGLE_REDIRECT_URI}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
