# =============================================================================
# 用户服务 onepage-user-service
# 值全部来自进程环境变量（与上线一致）。本地由 IDEA 把 .env 注入成环境变量。
# =============================================================================

server:
  port: ${USER_PORT}

spring:
  application:
    name: onepage-user-service
  datasource:
    url: jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT}/${MYSQL_USER_DB}?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=utf8
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}
  cloud:
    nacos:
      server-addr: "${NACOS_SERVER_ADDR}"
      username: ${NACOS_USERNAME}
      password: "${NACOS_PASSWORD}"
      discovery:
        server-addr: "${NACOS_SERVER_ADDR}"
        namespace: ${NACOS_NAMESPACE}
        group: ${NACOS_GROUP}
        context-path: nacos
        username: ${NACOS_USERNAME}
        password: "${NACOS_PASSWORD}"
    loadbalancer:
      nacos:
        enabled: true

onepage:
  internal-token: ${INTERNAL_TOKEN}
  media-public-base: ${MEDIA_PUBLIC_BASE}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
