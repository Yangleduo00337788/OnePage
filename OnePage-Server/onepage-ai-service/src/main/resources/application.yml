# =============================================================================
# AI 服务 onepage-ai-service
# 不引入 LangChain4j / Spring AI；HTTP 调兼容 OpenAI 的 Chat Completions。
# =============================================================================

server:
  port: ${AI_PORT}

spring:
  application:
    name: onepage-ai-service
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD:}
  cloud:
    nacos:
      server-addr: "${NACOS_SERVER_ADDR}"
      username: ${NACOS_USERNAME}
      password: "${NACOS_PASSWORD}"
      discovery:
        server-addr: "${NACOS_SERVER_ADDR}"
        namespace: ${NACOS_NAMESPACE}
        group: ${NACOS_GROUP}
        context-path: nacos
        username: ${NACOS_USERNAME}
        password: "${NACOS_PASSWORD}"
    loadbalancer:
      nacos:
        enabled: true

onepage:
  internal-token: ${INTERNAL_TOKEN}
  llm-base-url: ${LLM_BASE_URL}
  llm-api-key: ${LLM_API_KEY:}
  llm-model: ${LLM_MODEL}
  llm-review-base-url: ${LLM_REVIEW_BASE_URL:}
  llm-review-api-key: ${LLM_REVIEW_API_KEY:}
  llm-review-model: ${LLM_REVIEW_MODEL:}
